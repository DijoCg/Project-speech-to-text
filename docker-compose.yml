services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speechdb
      POSTGRES_USER: speechuser
      POSTGRES_PASSWORD: speechpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speechuser -d speechdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://speechuser:speechpass@db:5432/speechdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
